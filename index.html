<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f08a1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Imagicaa Map</title>
<style>
:root{--ink:#2b1b0e;--cream:#fff8ea;--orange:#f08a1c;--purple:#7b3fa0;--line:#e9d9b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8b8;color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#vp{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#cfe8b8}
#world{position:absolute;left:0;top:0;width:2400px;height:1200px;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform .3s ease}
#map{display:block;width:2400px;height:1200px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pin{position:absolute;width:30px;height:30px;padding:0;border-radius:50%;border:2.5px solid #fff;color:#fff;font:700 13px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.45);transform:translate(-50%,-50%) scale(var(--inv,1));cursor:pointer}
.pin::after{content:"";position:absolute;inset:-8px}
.pin.hide{display:none}
.pin.sel{z-index:20;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 7px var(--ink)}
.pin.moving{animation:blink .8s infinite}
@keyframes blink{50%{opacity:.35}}
.lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;font:700 11px/1.1 system-ui,sans-serif;color:var(--ink);white-space:nowrap;text-shadow:-1px -1px #fff,1px -1px #fff,-1px 1px #fff,1px 1px #fff,0 0 3px #fff;display:none;pointer-events:none}
#world.labels .lbl{display:block}
#acc{position:absolute;border-radius:50%;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.5);transform:translate(-50%,-50%);display:none;pointer-events:none}
#me{position:absolute;width:20px;height:20px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,.35),0 1px 5px rgba(0,0,0,.5);transform:translate(-50%,-50%) scale(var(--inv,1));display:none;pointer-events:none;z-index:30}
#top{position:fixed;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 8px 4px;z-index:50;pointer-events:none}
#top>*{pointer-events:auto}
#bar{display:flex;gap:6px}
#q{flex:1;min-width:0;border:2px solid var(--ink);border-radius:22px;padding:9px 14px;font:inherit;background:var(--cream)}
.btn{border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:22px;font:600 14px/1 inherit;padding:10px 14px}
.btn:active{background:var(--line)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:7px 2px 3px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ink);background:var(--cream);border-radius:16px;padding:5px 11px;font:600 13px/1.1 inherit;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
#sug{background:var(--cream);border:2px solid var(--ink);border-radius:14px;margin:4px 0 0;display:none;overflow:hidden}
#sug button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;font:inherit;color:var(--ink)}
#sug button:last-child{border:0}
#hint{position:fixed;left:8px;top:calc(max(8px,env(safe-area-inset-top)) + 100px);z-index:40;max-width:calc(100% - 70px);background:rgba(43,27,14,.88);color:#fff;border-radius:12px;padding:6px 10px;font-size:12.5px;pointer-events:none}
#loc{position:fixed;right:12px;z-index:60;bottom:calc(16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);font-size:26px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:bottom .25s}
#loc.on{background:#2563eb;color:#fff}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--cream);border-top:3px solid var(--ink);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:62vh;overflow:auto;box-shadow:0 -4px 16px rgba(0,0,0,.25)}
#sheet.open{transform:none}
#sheet h2{margin:0 52px 4px 0;font-size:19px;line-height:1.2}
#sx{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:18px;color:var(--ink)}
.tag{display:inline-block;color:#fff;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700}
#dist{font-size:13px;margin-left:6px;color:#555}
#desc{margin:8px 0}
#notes{width:100%;min-height:54px;border:2px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row .btn{flex:1;white-space:nowrap;padding:11px 10px;font-size:13px}
#menu{position:fixed;right:8px;top:58px;z-index:70;background:var(--cream);border:2px solid var(--ink);border-radius:14px;display:none;min-width:210px;overflow:hidden}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;color:var(--ink)}
#menu button:last-child{border:0}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;border-radius:18px;padding:9px 16px;font-size:13.5px;max-width:86%;text-align:center;display:none}
</style>
</head>

const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const seen={};
const P=RAW.map(r=>{let id=slug(r[0]);seen[id]=(seen[id]||0)+1;if(seen[id]>1)id+='-'+seen[id];return{id,n:r[0],c:r[1],x:r[2]*K,y:r[3]*K,d:r[4],g:r[5]||CATS[r[1]].g}});
const byId=Object.fromEntries(P.map(p=>[p.id,p]));

let over=LS.get('pos',{}), notes=LS.get('notes',{}), cal=LS.get('cal',[]);
const pos=p=>over[p.id]||[p.x,p.y];

/* ---------- view ---------- */
const vp=$('#vp'), world=$('#world');
let vw=innerWidth, vh=innerHeight, s=1, tx=0, ty=0;
const minS=()=>Math.max(vw/W,0.1), maxS=()=>3;
function clampView(){
  s=Math.min(maxS(),Math.max(minS(),s));
  const pw=W*s, ph=H*s, m=80;
  tx = pw>vw ? Math.min(m,Math.max(vw-pw-m,tx)) : (vw-pw)/2;
  ty = ph>vh ? Math.min(m,Math.max(vh-ph-m,ty)) : (vh-ph)/2;
}
function apply(){clampView();world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;world.style.setProperty('--inv',1/s);world.classList.toggle('labels',s>=1.05)}
function flyTo(x,y,ns,sy){ // put image point (x,y) at screen center (vw/2, sy)
  world.classList.add('anim'); s=ns||s; tx=vw/2-x*s; ty=(sy??vh/2)-y*s; apply();
  setTimeout(()=>world.classList.remove('anim'),320);
}
const ptrs=new Map(); let drag=null,pinch=null,moved=false;
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
vp.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={sx:e.clientX,sy:e.clientY,tx,ty};moved=false;pinch=null}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:dist2(a,b),s,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,tx,ty};moved=true;drag=null}
});
vp.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2&&pinch){
    const [a,b]=[...ptrs.values()];
    const ns=Math.min(maxS(),Math.max(minS(),pinch.s*dist2(a,b)/pinch.d));
    const wx=(pinch.cx-pinch.tx)/pinch.s, wy=(pinch.cy-pinch.ty)/pinch.s;
    s=ns; tx=(a.x+b.x)/2-wx*s; ty=(a.y+b.y)/2-wy*s; apply();
  }else if(drag&&ptrs.size===1){
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    if(!moved&&Math.hypot(dx,dy)<8)return;
    moved=true; tx=drag.tx+dx; ty=drag.ty+dy; apply();
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1){const p=[...ptrs.values()][0];drag={sx:p.x,sy:p.y,tx,ty}}
  if(ptrs.size===0){drag=null; if(!moved&&e.type==='pointerup')mapTap(e)}
}
vp.addEventListener('pointerup',endPtr);
vp.addEventListener('pointercancel',endPtr);
vp.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015),ns=Math.min(maxS(),Math.max(minS(),s*f));const wx=(e.clientX-tx)/s,wy=(e.clientY-ty)/s;s=ns;tx=e.clientX-wx*s;ty=e.clientY-wy*s;apply()},{passive:false});
addEventListener('resize',()=>{vw=innerWidth;vh=innerHeight;apply()});

/* ---------- pins ---------- */
let filter='all', sel=null, moveId=null;
for(const p of P){
  const b=document.createElement('button');
  b.className='pin'; b.dataset.id=p.id; b.style.background=CATS[p.c].c; b.setAttribute('aria-label',p.n);
  b.innerHTML=`${p.g}<span class="lbl"></span>`; b.querySelector('.lbl').textContent=p.n.replace(/ \(.*\)/,'');
  b.addEventListener('click',ev=>{ev.stopPropagation();if(moved)return;select(p.id)});
  world.appendChild(b); p.el=b;
}
function placePins(){
  for(const p of P){const [x,y]=pos(p);p.el.style.left=x+'px';p.el.style.top=y+'px';
    p.el.classList.toggle('hide',filter!=='all'&&p.c!==filter&&p.id!==sel)}
}
const chips=$('#chips');
[['all','All'],...Object.entries(CATS).map(([k,v])=>[k,v.l])].forEach(([k,l])=>{
  const c=document.createElement('button');c.className='chip'+(k==='all'?' on':'');c.textContent=l;c.dataset.k=k;
  c.onclick=()=>{filter=k;[...chips.children].forEach(x=>x.classList.toggle('on',x.dataset.k===k));placePins()};
  chips.appendChild(c);
});

/* ---------- sheet ---------- */
const sheet=$('#sheet');
function select(id){
  sel=id; const p=byId[id];
  P.forEach(q=>q.el.classList.toggle('sel',q.id===id));
  $('#sn').textContent=p.n;
  const t=$('#st');t.textContent=CATS[p.c].l;t.style.background=CATS[p.c].c;
  $('#desc').textContent=p.d;
  $('#notes').value=notes[id]||'';
  $('#bReset').style.display=over[id]?'':'none';
  $('#sug').style.display='none';
  sheet.classList.add('open'); $('#loc').style.bottom=(sheet.offsetHeight+14)+'px';
  placePins(); updDist();
  const [x,y]=pos(p), h=sheet.offsetHeight, top=110;
  flyTo(x,y,Math.max(s,0.9),top+(vh-h-top)/2);
}
function closeSheet(){sel=null;moveId=null;sheet.classList.remove('open');$('#loc').style.bottom='';P.forEach(q=>q.el.classList.remove('sel','moving'));placePins()}
$('#sx').onclick=closeSheet;
$('#notes').addEventListener('input',e=>{if(!sel)return;const v=e.target.value.trim();if(v)notes[sel]=v;else delete notes[sel];LS.set('notes',notes)});
$('#bHere').onclick=()=>sel&&calHere(byId[sel]);
$('#bMove').onclick=()=>{if(!sel)return;moveId=sel;byId[sel].el.classList.add('moving');toast('Tap the map where this really is');sheet.classList.remove('open');$('#loc').style.bottom=''};
$('#bReset').onclick=()=>{if(!sel)return;delete over[sel];LS.set('pos',over);$('#bReset').style.display='none';placePins();toast('Pin reset')};
function mapTap(e){
  if(e.target.closest&&e.target.closest('.pin'))return;
  if(moveId){
    const x=(e.clientX-tx)/s,y=(e.clientY-ty)/s;
    over[moveId]=[Math.round(x),Math.round(y)];LS.set('pos',over);
    const id=moveId;moveId=null;byId[id].el.classList.remove('moving');placePins();select(id);toast('Pin moved');return;
  }
  $('#sug').style.display='none';$('#menu').style.display='none';
  if(sel)closeSheet();
}

/* ---------- search ---------- */
const q=$('#q'),sug=$('#sug');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();sug.innerHTML='';
  if(!v){sug.style.display='none';return}
  const m=P.filter(p=>p.n.toLowerCase().includes(v)||CATS[p.c].l.toLowerCase().startsWith(v)).slice(0,6);
  m.forEach(p=>{const b=document.createElement('button');b.textContent=p.n+'  ·  '+CATS[p.c].l;b.onclick=()=>{q.value='';q.blur();select(p.id)};sug.appendChild(b)});
  sug.style.display=m.length?'block':'none';
});

/* ---------- GPS + calibration ---------- */
let T=null,fitErr=null,fitSpread=false,last=null,watchId=null;
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function refit(){
  T=null;fitErr=null;fitSpread=false;
  if(cal.length<2)return;
  const lat0=avg(cal.map(c=>c.lat)),lon0=avg(cal.map(c=>c.lon)),k=Math.cos(lat0*Math.PI/180)*111320;
  const Z=cal.map(c=>[(c.lon-lon0)*k,-(c.lat-lat0)*110540]),Pp=cal.map(c=>[c.x,c.y]);
  const zm=[avg(Z.map(z=>z[0])),avg(Z.map(z=>z[1]))],pm=[avg(Pp.map(z=>z[0])),avg(Pp.map(z=>z[1]))];
  let nr=0,ni=0,den=0;
  for(let i=0;i<Z.length;i++){const dz=[Z[i][0]-zm[0],Z[i][1]-zm[1]],dp=[Pp[i][0]-pm[0],Pp[i][1]-pm[1]];
    nr+=dz[0]*dp[0]+dz[1]*dp[1];ni+=dz[0]*dp[1]-dz[1]*dp[0];den+=dz[0]*dz[0]+dz[1]*dz[1]}
  if(den<800){fitSpread=true;return}
  const a=[nr/den,ni/den],b=[pm[0]-(a[0]*zm[0]-a[1]*zm[1]),pm[1]-(a[0]*zm[1]+a[1]*zm[0])];
  T={lat0,lon0,k,a,b,ppm:Math.hypot(a[0],a[1])};
  let se=0;for(let i=0;i<Z.length;i++){const m=toMap2(Z[i]);se+=(m[0]-Pp[i][0])**2+(m[1]-Pp[i][1])**2}
  fitErr=Math.sqrt(se/Z.length)/T.ppm;
}
function toMap2(z){return[T.a[0]*z[0]-T.a[1]*z[1]+T.b[0],T.a[0]*z[1]+T.a[1]*z[0]+T.b[1]]}
function toMap(lat,lon){return toMap2([(lon-T.lon0)*T.k,-(lat-T.lat0)*110540])}
const me=$('#me'),acc=$('#acc');
function placeMe(){
  if(!last||!T){me.style.display=acc.style.display='none';return}
  const [x,y]=toMap(last.lat,last.lon);
  if(x<-200||y<-200||x>W+200||y>H+200){me.style.display=acc.style.display='none';return}
  me.style.display='block';me.style.left=x+'px';me.style.top=y+'px';
  const r=Math.min(500,last.acc*T.ppm);acc.style.display='block';acc.style.left=x+'px';acc.style.top=y+'px';acc.style.width=acc.style.height=(2*r)+'px';
}
function updDist(){
  const el=$('#dist');el.textContent='';
  if(!sel||!T||!last)return;
  const [mx,my]=toMap(last.lat,last.lon),[px,py]=pos(byId[sel]);
  const m=Math.hypot(px-mx,py-my)/T.ppm;
  el.textContent=`≈ ${Math.round(m/10)*10||10} m · ${Math.max(1,Math.round(m/1.2/60))} min walk (approx.)`;
}
function updHint(){
  const h=$('#hint');let t='';
  if(!isSecureContext)t='GPS needs https — host this on GitHub Pages';
  else if(watchId===null&&!last)t='Tap ◎ to turn on GPS';
  else if(!last)t='Finding GPS…';
  else if(fitSpread)t='Add a calibration point 40 m+ away from the first';
  else if(!T)t=`Calibrate (${cal.length}/2): stand at a spot, tap its pin → “I’m here”`;
  else t=`GPS ±${Math.round(last.acc)} m · ${cal.length} cal pts`+(fitErr!=null?` · fit ±${Math.round(fitErr)} m`:'');
  h.textContent=t;h.style.display=t?'':'none';
}
function startGPS(){
  if(watchId!==null)return;
  if(!navigator.geolocation||!isSecureContext){updHint();return}
  watchId=navigator.geolocation.watchPosition(pos_=>{
    last={lat:pos_.coords.latitude,lon:pos_.coords.longitude,acc:pos_.coords.accuracy||30};
    placeMe();updDist();updHint();
  },err=>{toast(err.code===1?'Location permission denied':'GPS error: '+err.message);watchId=null;$('#loc').classList.remove('on');updHint()},{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  $('#loc').classList.add('on');updHint();
}
$('#loc').onclick=()=>{
  if(watchId===null){startGPS();return}
  if(last&&T){const [x,y]=toMap(last.lat,last.lon);flyTo(x,y,Math.max(s,1))}
  else toast(last?'Not calibrated yet':'Still finding GPS…');
};
function calHere(p){
  if(!last){startGPS();toast('Waiting for GPS… try again in a few seconds');return}
  if(last.acc>40&&!confirm(`GPS accuracy is only ±${Math.round(last.acc)} m right now. Use it anyway?`))return;
  const [x,y]=pos(p);
  cal=cal.filter(c=>c.id!==p.id);
  cal.push({lat:last.lat,lon:last.lon,x,y,id:p.id});LS.set('cal',cal);
  refit();placeMe();updDist();updHint();
  toast(T?'Calibrated ✓':`Point saved (${cal.length}/2). Walk 40 m+ and do another.`);
}
$('#menuBtn').onclick=e=>{e.stopPropagation();const m=$('#menu');m.style.display=m.style.display==='block'?'none':'block'};
$('#mUndo').onclick=()=>{cal.pop();LS.set('cal',cal);refit();placeMe();updHint();$('#menu').style.display='none';toast('Last point removed')};
$('#mClear').onclick=()=>{if(confirm('Clear all calibration points?')){cal=[];LS.set('cal',cal);refit();placeMe();updHint();$('#menu').style.display='none'}};
$('#mPins').onclick=()=>{if(confirm('Reset all moved pins to their original spots?')){over={};LS.set('pos',over);placePins();$('#menu').style.display='none'}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)}

/* ---------- init ---------- */
refit();placePins();
s=Math.max(minS(),vh/H*1.05);
{const e=byId['entrance'],[x,y]=pos(e);tx=vw/2-x*s;ty=vh/2-y*s;apply()}
updHint();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
